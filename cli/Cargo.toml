[package]
name = "email-verifier-cli"
version = "3.0.0"
edition = "2021"

[dependencies]
email-verifier-core = { path = "../core" }
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.34", features = ["full", "time", "sync", "macros", "rt-multi-thread"] }
anyhow = "1.0"
tracing = "0.1"
serde_json = "1.0"


