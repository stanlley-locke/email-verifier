[package]
name = "email-verifier"
version = "3.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Production-grade email verification with typo correction, dual output modes, and smart deduplication"
license = "MIT"
repository = "https://github.com/yourusername/email-verifier"

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.34", features = ["full", "time", "sync", "macros", "rt-multi-thread"] }

# HTTP/DNS/SMTP
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
# FIX: Use rustls instead of native-tls for lettre to avoid feature conflict
lettre = {
    version = "0.11",
    default-features = false,
    features = [
        "builder",
        "smtp-transport",
        "tokio1-rustls-tls"        
    ]
}
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# File I/O
calamine = "0.23"
csv = "1.3"
rust_xlsxwriter = "0.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# String processing
regex = "1.10"
once_cell = "1.19"

# Concurrency & caching
rayon = "1.8"
lru = "0.12"
dashmap = "5.5"

# Logging & progress
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
indicatif = "0.17"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
lazy_static = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true